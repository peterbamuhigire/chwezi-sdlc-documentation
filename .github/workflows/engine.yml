name: Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c requirements-ci.txt -e ".[dev]"
      - run: pytest --cov=engine --cov-fail-under=90
      - run: python scripts/validate_engine.py
      - run: python scripts/validate_skill_engine.py --baseline tests/skill-quality-baseline.json
      - name: Routing smoke test (top-3, owned negatives, precision@1 floor, fixture lint; M10-03)
        run: python scripts/routing_smoke_test.py --min-rank1 83 --lint-fixtures --min-covered 8
      - name: Routing and Tier-1 lint unit tests (M10-03)
        run: python -m pytest -q -o addopts="" tests/test_routing_smoke_owned_negatives.py tests/test_validate_skill_engine_tier1.py
      - run: python -m engine validate-skills
      - name: Plugin manifests and package entry budget
        run: python scripts/validate_plugin_packages.py
      - name: Portability (no tracked per-user settings, no machine paths)
        run: python scripts/check_portable_paths.py
      - name: Dev-engine references (flat-layout names; category paths need a checkout, so NOT_ASSESSED here)
        run: python scripts/check_cross_engine_refs.py
      - name: Superseded-standard and WCAG ratchet
        run: python scripts/check_standards_currency.py
      - name: Source register review dates
        run: python scripts/validate_source_register.py
      - name: Traceability evidence fixture
        run: python scripts/validate_traceability_evidence.py engine/tests/fixtures/traceability-evidence.json
      - name: Validate SDD phase-boundary contract
        run: python scripts/validate_sdd_phase_boundaries.py --feature-dir engine/tests/fixtures/sdd_feature
      - name: Validate SRS decision and debt contract
        run: python scripts/validate_requirements_decision.py engine/tests/fixtures/requirements_decision/reuse.json
      - run: python scripts/seed_demo_project.py
      - name: Demo passes
        run: python -m engine validate projects/_demo-hybrid-regulated
      - name: Demo fails when sabotaged
        run: |
          if python -m engine validate projects/_demo-hybrid-regulated --break-something; then
            echo "Sabotaged demo unexpectedly passed" >&2
            exit 1
          fi
