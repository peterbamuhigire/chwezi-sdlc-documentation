schema_version: "1.0"
engine_id: srs-skills
display_name: SRS Skills
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: '**/SKILL.md'
validation:
  - id: release-gate
    command: >-
      python -X utf8 scripts/validate_skill_engine.py --baseline tests/skill-quality-baseline.json
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: '**/SKILL.md'
  references: references/**
invariants:
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries, chapter-by-chapter notes and book-by-book"
  - id: not-assessed
    phrase: "Missing execution, render, source, reviewer, or stakeholder evidence is `NOT ASSESSED`, never a pass."
  - id: iso-29148
    phrase: "Requirement quality is judged against ISO/IEC/IEEE 29148:2018 (individual and set characteristics;"
invariant_exemptions:
  british-english: "No British English output rule exists in the SRS router (AGENTS.md, former CLAUDE.md, README.md, rules/common/); adding one is new doctrine outside M10-02-T02 scope."
plugin_exclusions:
  - path: "templates/skill"
    reason: "authoring template copied when a new skill is created; not an active skill"
